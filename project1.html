<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login Web</title>
  
  <style>
    /* Kode CSS Anda di sini */
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, Sans-Serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url(59d7545e0f7d81160d16e347b01a6be0.jpg) no-repeat center
      center/cover;
    }
    
    .form-box {
      background: rgba(0,0,0,0.4);
      padding: 20px;
      width: 350px;
      border-radius: 18px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    
    h3 {
      color: grey;
      text-align: center;
      margin-bottom: 20px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      
      background: rgba(255,255,255,0.1);
      border: 1.4px solid rgba(255,255,255,0.3);
      color:white;
      
      border-radius: 10px;
      font-size: 15px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    
    input:placeholder {
      color: #ddd;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  
  <form class="form-box" action="/api/login" method="POST">
    <h3>Login</h3>
    
    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">
    
    <button type="submit">Masuk</button>
  </form>

  <script>
    // Pastikan kode dijalankan setelah semua elemen dimuat
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.querySelector('.form-box');
        const usernameInput = document.querySelector('input[name="username"]');
        const passwordInput = document.querySelector('input[name="password"]');

        loginForm.addEventListener('submit', function(event) {
            // Menghentikan pengiriman formulir ke action="/api/login"
            event.preventDefault(); 

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === "" || password === "") {
                alert("Username dan Password tidak boleh kosong!");
                return;
            }

            // Memanggil fungsi utama untuk memproses login/registrasi
            handleLogin(username, password);
        });

        function handleLogin(username, password) {
            // Ambil data pengguna yang sudah tersimpan (kunci: 'user')
            const storedUserJSON = localStorage.getItem('user');
            
            if (storedUserJSON) {
                // --- PROSES LOGIN (Jika data sudah ada) ---
                const storedUser = JSON.parse(storedUserJSON);

                if (storedUser.username === username && storedUser.password === password) {
                    alert(`Login Berhasil! Selamat datang, ${username}`);
                    // Biasanya, kode akan mengarahkan ke halaman lain di sini
                    // window.location.href = "dashboard.html";
                } else {
                    alert("Login Gagal! Username atau Password salah.");
                }

            } else {
                // --- PROSES REGISTRASI/SIMPAN (Jika data belum ada) ---
                const newUser = { username, password };
                
                // Menyimpan data ke Local Storage sebagai string JSON
                localStorage.setItem('user', JSON.stringify(newUser));
                
                alert(`Registrasi Berhasil! Username ${username} tersimpan. Silakan login kembali dengan data yang sama.`);
                
                // Mengosongkan input
                usernameInput.value = '';
                passwordInput.value = '';
            }
        }
    });
</script>
</body>
</html>  </style>
</head>
<body>
  
  <div class="form-box">
    <h3>Login</h3>
    
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    
    <button>Masuk</button>
  </div>
</body>
</html>
</html>
