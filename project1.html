<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  
  <style>
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, Sans-Serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url(59d7545e0f7d81160d16e347b01a6be0.jpg) no-repeat center
      center/cover;
    }
    
    .form-box {
      background: rgba(0,0,0,0.4);
      padding: 20px;
      width: 350px;
      border-radius: 18px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    
    h3 {
      color: grey;
      text-align: center;
      margin-bottom: 20px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      
      background: rgba(255,255,255,0.1);
      border: 1.4px solid rgba(255,255,255,0.3);
      color:white;
      
      border-radius: 10px;
      font-size: 15px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    
    input:placeholder {
      color: #ddd;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }
    
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  
  <div class="form-box">
    <h3>Login</h3>
    
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    
    <button>Masuk</button>
  </div>
</body>
</html>
</html>
